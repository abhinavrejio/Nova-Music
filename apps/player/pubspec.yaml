name: player
description: Nova Music Player
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Cupertino
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.4.2

  # Routing
  go_router: ^17.4.0

  # Audio
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7

  # File Picker
  file_picker: ^10.3.2

  # Storage
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3

  # Utilities
  equatable: ^2.1.0
  intl: ^0.20.3

  # Fonts
  google_fonts: ^6.3.3

  # Metadata
  flutter_media_metadata: ^1.0.0+1

  # Progress Bar
  audio_video_progress_bar: ^2.0.3

  just_audio: ^0.10.5
  on_audio_query: ^2.9.0

  # lyrics
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
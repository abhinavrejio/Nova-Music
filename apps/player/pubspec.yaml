name: player
description: "Nova Music Player"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Routing
  go_router: ^17.4.0

  # State Management
  flutter_riverpod: ^3.4.2

  # Local Storage
  path_provider: ^2.1.6

  # Equality
  equatable: ^2.1.0

  # Date & Time
  intl: ^0.20.3

  # Fonts
  google_fonts: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/
    - lib/assets/icons/



  # Future fonts can be added here
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf